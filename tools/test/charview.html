<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Character viewer</title>
<style>html,body{margin:0;height:100%;background:#1b222c;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"../../lib/three/build/three.module.js","three/addons/":"../../lib/three/jsm/"}}</script>
</head><body>
<script type="module">
// Character viewer: ?m=player_female&o=circuit_coat&h=ponytail&v=front|q|back|face&a=IdleRelaxed
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const R = new THREE.WebGLRenderer({ antialias: true }); R.setSize(innerWidth, innerHeight); R.setPixelRatio(1);
R.toneMapping = THREE.ACESFilmicToneMapping; R.outputColorSpace = THREE.SRGBColorSpace; R.shadowMap.enabled = true;
document.body.appendChild(R.domElement);
const sc = new THREE.Scene(); sc.background = new THREE.Color(0x1b222c);
sc.environment = new THREE.PMREMGenerator(R).fromScene(new RoomEnvironment(), .04).texture; sc.environmentIntensity = .5;
const key = new THREE.DirectionalLight(0xfff2e6, 2.6); key.position.set(2, 3, 3); key.castShadow = true; sc.add(key);
const rim = new THREE.DirectionalLight(0x9fc4ff, 1.6); rim.position.set(-2, 2, -3); sc.add(rim);
sc.add(new THREE.HemisphereLight(0xc8d8ff, 0x2a2420, .7));
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, .05, 50);
new GLTFLoader().load('../../assets/models/' + (q.get('m') || 'player_female') + '.glb', g => {
  const root = g.scene; sc.add(root);
  let meta = {}; root.traverse(o => { if (o.userData && o.userData.worldex) meta = JSON.parse(o.userData.worldex); });
  const outfit = q.get('o') || Object.keys(meta.outfits || {})[0], hair = q.get('h') || (meta.hair || [])[0];
  const hide = new Set((meta.outfits || {})[outfit] || []);
  root.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = o.receiveShadow = true; o.frustumCulled = false;
    let n = o.name, top = o; while (top.parent && top.parent !== root && !/^(O_|H_|B_|head|ears)/.test(n)) { top = top.parent; n = top.name; }
    if (n.startsWith('O_')) o.visible = n === 'O_' + outfit;
    else if (n.startsWith('H_')) o.visible = n === 'H_' + hair;
    else if (n.startsWith('B_')) o.visible = !hide.has(n.slice(2));
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach(m => { if (m.alphaTest > 0 || /hair_card/.test(m.name)) { m.alphaTest = .5; m.transparent = false; m.side = THREE.DoubleSide; m.alphaToCoverage = true; } });
  });
  const mixer = new THREE.AnimationMixer(root);
  const clip = g.animations.find(c => c.name === (q.get('a') || 'IdleRelaxed'));
  if (clip) { const a = mixer.clipAction(clip); a.play(); mixer.setTime(+(q.get('t') || 0)); }
  const H = /male/.test(q.get('m') || '') && !/female/.test(q.get('m') || '') ? 1.83 : 1.58;
  const v = q.get('v') || 'q';
  const views = { front: [0, H * .55, 4.6, H * .52], q: [2.6, H * .6, 3.8, H * .52], back: [-1, H * .6, -4.4, H * .52], face: [.35, H * .93, 1.15, H * .91], side: [4.4, H * .55, .2, H * .52] };
  const [x, y, z, ty] = views[v]; cam.position.set(x, y, z); cam.lookAt(0, ty, 0);
  R.render(sc, cam); window.__ready = true;
});
</script></body></html>
