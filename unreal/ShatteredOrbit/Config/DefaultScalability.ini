; Shattered Orbit scalability presets on top of the engine's BaseScalability.ini.
; Low / Medium (0-1): no Lumen (screen-space only) and regular shadow maps so mid-range laptops hold 60 fps;
; High (2): Lumen at reduced quality + VSM; Epic / Cinematic (3-4): full Lumen + VSM.
; The graphics menu toggles in USOGameUserSettings override these with game-setting priority.

[GlobalIlluminationQuality@0]
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=2

[GlobalIlluminationQuality@1]
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=2

[ShadowQuality@0]
r.Shadow.Virtual.Enable=0

[ShadowQuality@1]
r.Shadow.Virtual.Enable=0

[ShadowQuality@2]
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasDirectional=-0.5

[AntiAliasingQuality@0]
r.AntiAliasingMethod=1

[PostProcessQuality@0]
r.MotionBlurQuality=0
